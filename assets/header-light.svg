  <style>
    .back { animation: drift 22s linear infinite; }
    .front { animation: drift 14s linear infinite reverse; }
    .swim { animation: swim 26s linear -9s infinite; }
    .bob { animation: bob 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    .b { fill: #e8f3f7; opacity: 0; animation: rise linear infinite; }
    .word { fill: #217c76; }
    .tag { fill: #3f5a60; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-720px); } }
    @keyframes swim { from { transform: translateX(1420px); } to { transform: translateX(-260px); } }
    @keyframes bob { from { transform: translateY(-3px) rotate(-2deg); } to { transform: translateY(4px) rotate(2deg); } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-90px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .back, .front, .bob, .b { animation: none; } .swim { animation: none; transform: translateX(860px); } }
  </style>
</defs>
