  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d8ebf2"/><stop offset="1" stop-color="#b9d4dc"/>
  </linearGradient>
  <radialGradient id="glow" cx=".18" cy="-.1" r=".7">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="320">
